<!DOCTYPE html>
<html>
<head>
<title>Elegant Profile</title>

<style>
body{
    font-family: Arial;
    background:#dfe6ed;
    margin:0;
}

.container{
    width:70%;
    margin:auto;
    margin-top:30px;
}

header{
    background:white;
    padding:30px;
    border-radius:10px;
    border:2px solid #5c6bc0;
    text-align:center;
}

section{
    background:white;
    padding:25px;
    margin-top:20px;
    border-radius:10px;
    border:2px solid #5c6bc0;
}

input, textarea{
    width:95%;
    padding:10px;
    border-radius:5px;
    border:1px solid gray;
}

button{
    background:#5c6bc0;
    color:white;
    padding:10px 25px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:black;
}

footer{
    text-align:center;
    padding:10px;
}
footer a{
    color:#5c6bc0;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>Your Name</h1>
<p>Simple • Professional • Confident</p>
</header>

<section>
<h2>About</h2>
<p>I aim to continuously improve my knowledge and discipline.</p>
</section>

<section>
<h2>Skills</h2>
<ul>
<li>Focus</li>
<li>Consistency</li>
<li>Problem Solving</li>
</ul>
</section>

<section>
<h2>Contact</h2>
<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Message:</label>
<textarea rows="5"></textarea>

<br><br>
<button>Send</button>
</section>

<footer>
Visit <a href="https://www.coursera.org">Coursera</a>
</footer>

</div>

</body>
</html>
