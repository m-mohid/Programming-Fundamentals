<!DOCTYPE html>
<html>
<head>
<title>Personal Website</title>

<style>

body{
    font-family: Arial;
    background:#e6eef5;
    margin:0;
}

header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:30px;
}

section{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:10px;
    border:2px solid #4CAF50;
}

ul li{
    margin:5px;
}

input, textarea{
    width:95%;
    padding:10px;
    margin-top:5px;
    border-radius:5px;
    border:1px solid gray;
}

input[type="submit"]{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

input[type="submit"]:hover{
    background:black;
}

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:10px;
}

footer a{
    color:yellow;
}

</style>
</head>

<body>

<header>
    <h1>Your Name</h1>
    <p>Aspiring Developer</p>
</header>

<section>
<h2>About</h2>
<p>I love learning new technologies...</p>
</section>

<section>
<h2>Interests</h2>

<ul>
<li>Coding</li>
<li>Gaming</li>
<li>Reading</li>
<li>Sports</li>
</ul>
</section>

<section>
<h2>Contact Me</h2>

<form>
<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Feedback:</label>
<textarea rows="5"></textarea>

<input type="submit" value="Submit">
</form>
</section>

<footer>
Educational Link:
<a href="https://www.wikipedia.org">Wikipedia</a>
</footer>

</body>
</html>
