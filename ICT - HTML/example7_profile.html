<!DOCTYPE html>
<html>
<head>
<title>Professional Profile</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#eef2f6;
}

.wrapper{
    width:85%;
    margin:auto;
}

header{
    background:#1f3c88;
    color:white;
    padding:35px;
    border-radius:0 0 12px 12px;
    text-align:center;
}

section{
    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:10px;
    border-left:5px solid #1f3c88;
}

input, textarea{
    width:95%;
    padding:10px;
    border-radius:5px;
    border:1px solid gray;
}

button{
    background:#1f3c88;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:black;
}

footer{
    text-align:center;
    padding:15px;
}
footer a{
    color:#1f3c88;
}
</style>
</head>

<body>

<div class="wrapper">

<header>
<h1>Your Name</h1>
<p>Student</p>
</header>

<section>
<h2>About Me</h2>
<p>I am a student building my skills to become a successful professional.</p>
</section>

<section>
<h2>Skills</h2>
<ul>
<li>Time Management</li>
<li>Communication</li>
<li>Technical Learning</li>
</ul>
</section>

<section>
<h2>Contact</h2>
<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Message:</label>
<textarea rows="5"></textarea>
<br><br>
<button>Send</button>
</section>

<footer>
Visit <a href="https://www.udemy.com">Udemy</a>
</footer>

</div>

</body>
</html>
