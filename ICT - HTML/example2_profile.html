<!DOCTYPE html>
<html>
<head>
<title>Portfolio Website</title>

<style>

body{
    font-family: Arial;
    background: #f2f2f2;
    margin: 0;
}

header{
    background:#2c7be5;
    color:white;
    text-align:center;
    padding:35px;
}

nav{
    background:#333;
    text-align:center;
    padding:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
}

nav a:hover{
    color:yellow;
}

section{
    background:white;
    margin:25px;
    padding:20px;
    border-radius:10px;
    border:2px solid #2c7be5;
}

form input,
form textarea{
    width:95%;
    padding:10px;
    margin-top:5px;
    border-radius:5px;
    border:1px solid gray;
}

button{
    background:#333;
    color:white;
    padding:10px 20px;
    border: none;
    margin-top:10px;
    cursor:pointer;
}

button:hover{
    background:#2c7be5;
}

footer{
    background:#000;
    color:white;
    text-align:center;
    padding:15px;
}

footer a{
    color:yellow;
}

</style>
</head>

<body>

<header>
    <h1>Your Name</h1>
    <p>Student | Web Learner | Enthusiast</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Skills</a>
    <a href="#">Contact</a>
</nav>

<section>
<h2>About Me</h2>
<p>I am a student currently learning web development...</p>
</section>

<section>
<h2>My Skills</h2>
<ol>
<li>HTML Basics</li>
<li>Problem Solving</li>
<li>Communication</li>
</ol>
</section>

<section>
<h2>Contact</h2>

<form>
<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Message:</label>
<textarea rows="5"></textarea>

<button type="submit">Send</button>
</form>

</section>

<footer>
Visit <a href="https://www.khanacademy.org" target="_blank">Khan Academy</a>
</footer>

</body>
</html>
