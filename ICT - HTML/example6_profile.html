<!DOCTYPE html>
<html>
<head>
<title>Minimal Portfolio</title>

<style>

body{
    font-family: Arial;
    background:#fafafa;
    margin:0;
}

header{
    text-align:center;
    padding:40px;
    background:white;
    border-bottom:2px solid #ddd;
}

section{
    background:white;
    margin:25px;
    padding:25px;
    border-radius:10px;
    border:1px solid #ddd;
}

h2{
    color:#555;
}

ul li{
    margin:6px;
}

input, textarea{
    width:95%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:black;
    color:white;
    padding:10px 25px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#555;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:12px;
}

footer a{
    color:#00d4ff;
}

</style>
</head>

<body>

<header>
<h1>Your Name</h1>
<p>Simplicity is Power</p>
</header>

<section>
<h2>About</h2>
<p>I focus on learning, improving, and growing.</p>
</section>

<section>
<h2>Skills</h2>
<ul>
<li>Focus</li>
<li>Dedication</li>
<li>Learning Ability</li>
</ul>
</section>

<section>
<h2>Contact</h2>

<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Message:</label>
<textarea rows="5"></textarea>

<br><br>
<button>Send</button>

</section>

<footer>
Visit <a href="https://www.futurelearn.com">Future Learn</a>
</footer>

</body>
</html>
