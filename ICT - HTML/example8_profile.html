<!DOCTYPE html>
<html>
<head>
<title>Soft Minimal Profile</title>

<style>
body{
    font-family: Arial;
    background:#dde6f1;
    margin:0;
}

header{
    background:#ffffff;
    text-align:center;
    padding:40px;
    border-bottom:3px solid #6c8cff;
}

section{
    background:white;
    margin:25px;
    padding:25px;
    border-radius:12px;
    border:1px solid #cfd8ff;
}

h2{
    color:#364e96;
}

input, textarea{
    width:95%;
    padding:10px;
    border-radius:6px;
    border:1px solid gray;
}

button{
    background:#364e96;
    color:white;
    border:none;
    padding:10px 25px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:black;
}

footer{
    text-align:center;
    padding:15px;
}
footer a{
    color:#364e96;
}
</style>
</head>

<body>

<header>
<h1>Your Name</h1>
<p>Focused. Calm. Professional.</p>
</header>

<section>
<h2>About Me</h2>
<p>I like working with consistency and discipline.</p>
</section>

<section>
<h2>Skills</h2>
<ul>
<li>Planning</li>
<li>Learning Ability</li>
<li>Team Cooperation</li>
</ul>
</section>

<section>
<h2>Contact</h2>
<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Message:</label>
<textarea rows="5"></textarea>

<br><br>
<button>Submit</button>
</section>

<footer>
Visit <a href="https://www.openlearning.com">Open Learning</a>
</footer>

</body>
</html>
