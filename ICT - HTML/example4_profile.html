<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background:#f0f0f0;
}

header{
    background:#8e44ad;
    color:white;
    text-align:center;
    padding:30px;
}

section{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:10px;
    border:2px solid #8e44ad;
}

table{
    width:100%;
    border-collapse:collapse;
}

table, th, td{
    border:1px solid black;
}

th, td{
    padding:10px;
    text-align:center;
}

input, textarea{
    width:95%;
    padding:10px;
    margin-top:5px;
}

button{
    padding:10px 20px;
    background:#8e44ad;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:black;
}

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:10px;
}

footer a{
    color:yellow;
}

</style>
</head>

<body>

<header>
<h1>Your Name</h1>
<p>Student Profile</p>
</header>

<section>
<h2>Personal Information</h2>
<p>Name: Your Name</p>
<p>Department: Your Department</p>
<p>University: Your University</p>
</section>

<section>
<h2>Skills</h2>

<table>
<tr>
<th>Skill</th>
<th>Level</th>
</tr>

<tr>
<td>HTML</td>
<td>Beginner</td>
</tr>

<tr>
<td>Communication</td>
<td>Good</td>
</tr>

</table>
</section>

<section>
<h2>Contact</h2>

<form>
<label>Name:</label>
<input type="text">

<label>Email:</label>
<input type="email">

<label>Message:</label>
<textarea rows="5"></textarea>

<button>Submit</button>
</form>
</section>

<footer>
Visit <a href="https://www.coursera.org">Coursera</a>
</footer>

</body>
</html>
