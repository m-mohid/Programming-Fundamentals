<!DOCTYPE html>
<html>
    <head>
        <title>Mohid's Profile</title>
        <link rel = "stylesheet" href = "style1.css">
    </head>
<body>
    <h1>Mohid's Personalized Form</h1>
    <h2>Personal Information</h2>

    <form>
        <label>Name:</label>
        <input type = "text">
        <br><br>

        <label>Email:</label>
        <input type = "Email">
        <br><br>

        <label>Favorite Color:</label>
        <input type = "color">
        <br><br>

        <label>Date:</label>
        <input type = "date">
        <br><br>

        <h2>Gender</h2>
        <input type = "radio" name = "Gender"> Male
        <input type = "radio" name = "Gender"> Female
        <input type = "radio" name = "Gender"> Other

        <h2>Hobbies</h2>
        <input type = "checkbox"> Reading
        <input type = "checkbox"> Gaming
        <input type = "checkbox"> Learning

        <h2>Rate Your HTML Learning</h2>
        <label>Learning Experience ( 1 - 10 ):</label>
        <input type = "range" min="1" max="10">

        <h2>Submit Your Work</h2>
        <label>Upload an Image: </label>
        <input type = "file">
        <br><br>

        <button type = "submit">Submit</button>
        <button type = "reset">Reset</button>

        <h2>Form Summary</h2>

        <table>
            <tr>
                <th>Input Type</th>
                <th>Example Data</th>
            </tr>

            <tr>
                <td>Name</td>
                <td>Mohid</td>
            </tr>

            <tr>
                <td>Email</td>
                <td>mohid@gmail.com</td>
            </tr>

            <tr>
                <td>Favorite Color</td>
                <td>#ff0000</td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>Male</td>
            </tr>
        </table>
    </form>
<br>
<a href="case.edu.org">CASE</a>

</body>
</html>
