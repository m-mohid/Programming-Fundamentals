<!DOCTYPE html>
<html>
    <head>
        <title>Products</title>
        <link rel = "stylesheet" href = style.css>
<style>
            /* Table background color */
            table {
    background-color: #f2f2f2;
    border-collapse: collapse;
}

/* Table border */
table, th, td {
    border: 1px solid black;
}

/* Table header text color */
th {
    color: white;
    background-color: #4b0082;
    padding: 10px;
}

/* Table data text color */
td {
    color: #000;
    padding: 10px;
}

        </style>
    </head>
<body>
    <table>

        <tr>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
        </tr>
        
        <tr>
            <td>Apple</td>
            <td>Fruits</td>
            <td>100</td>
        </tr>
        
        <tr>
            <td>Carrot</td>
            <td>Vegetables</td>
            <td>200</td>
        </tr>

        <tr>
            <td>Dairy Milk</td>
            <td>Chocolate</td>
            <td>500</td>
        </tr>

        <tr>
            <td>Burger</td>
            <td>Fast Food</td>
            <td>350</td>
        </tr>
    </table>
</body>
</html>
